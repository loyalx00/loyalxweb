<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません | 株式会社ロイヤルエクスペリエンス</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+JP:wght@300;400&family=Noto+Serif+JP:wght@300;400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background: #060E22;
      color: #F4F0EA;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 34rem; width: 100%; text-align: center; }
    .logo {
      width: 148px; height: auto; max-height: 46px;
      object-fit: contain;
      margin: 0 auto 3rem; display: block;
      /* 白背景の PNG を暗い背景に載せるため、index.html と同じく白シルエット化 */
      filter: brightness(0) invert(1);
    }
    .code {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(4.5rem, 16vw, 8rem);
      line-height: 1;
      color: #A89274;
      margin: 0 0 1.25rem;
    }
    .rule {
      width: 48px; height: 1px;
      background: #A89274;
      margin: 0 auto 2rem;
    }
    h1 {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: clamp(1.15rem, 3.5vw, 1.5rem);
      line-height: 1.65;
      margin: 0 0 1.5rem;
      color: #fff;
    }
    p {
      font-size: 0.86rem;
      line-height: 2;
      color: rgba(244,240,234,0.55);
      margin: 0 0 3rem;
    }
    .home {
      display: inline-block;
      border: 1px solid #A89274;
      color: #A89274;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 0.95rem 2.5rem;
      text-decoration: none;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .home:hover { background: #A89274; color: #060E22; }
    .links {
      margin-top: 3.5rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(168,146,116,0.2);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 2rem;
    }
    .links a {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(244,240,234,0.45);
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .links a:hover { color: #A89274; }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="/images/LX_logo.png" alt="LOYAL EXPERIENCE" width="148" height="54">

    <p class="code">404</p>
    <div class="rule"></div>

    <h1>お探しのページは見つかりませんでした</h1>
    <p>
      URL が変更されたか、削除された可能性があります。<br>
      お手数ですが、下記よりお進みください。
    </p>

    <a class="home" href="/">Back to Home</a>

    <nav class="links">
      <a href="/#about">About</a>
      <a href="/#business02">Inbound</a>
      <a href="/#business01">Marketing</a>
      <a href="/#news">News</a>
      <a href="/#company">Company</a>
      <a href="/#contact">Contact</a>
    </nav>
  </main>
</body>
</html>
